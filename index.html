<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aphelios | Skins Showcase</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <header>
        <nav>
            <div class="logo">APHELIOS</div>
            <p class="subtitle">O Armamento da Fé</p>
        </nav>
    </header>

    <main>
        <section class="skin-gallery">
            <div class="skin-card" style="--bg-image: url('https://cdn.mos.cms.futurecdn.net/v2/t:0,l:240,cw:1440,ch:1080,q:80,w:1440/oBNwGUPPN8HZPpTuYqxYnW.jpg');">
                <div class="skin-info">
                    <span>Original</span>
                    <h3>Aphelios Lunari</h3>
                </div>
            </div>

            <div class="skin-card" style="--bg-image: url('https://turbosmurfs.gg/storage/splash/Aphelios_1.jpg');">
                <div class="skin-info">
                    <span>Épica</span>
                    <h3>Emissário da Escuridão</h3>
                </div>
            </div>

            <div class="skin-card" style="--bg-image: url('https://turbosmurfs.gg/storage/splash/Aphelios_9.jpg');">
                <div class="skin-info">
                    <span>Legado</span>
                    <h3>Fera Lunar</h3>
                </div>
            </div>

            <div class="skin-card" style="--bg-image: url('https://opgg-static.akamaized.net/meta/images/lol/16.8.1/champion/tiles/Aphelios_18.jpg?image=q_auto:good,f_webp,w_722&v=1776924597');">
                <div class="skin-info">
                    <span>Mundial</span>
                    <h3>EDG Aphelios</h3>
                </div>
            </div>

             <div class="skin-card" style="--bg-image: url('https://www.esports.net/wp-content/uploads/2024/10/heartsteel-aphelios.jpg');">
                <div class="skin-info">
                    <span>Banda</span>
                    <h3>HEARTSTEEL</h3>
                </div>

            </div>
              <div class="skin-card" style="--bg-image: url('https://lh7-rt.googleusercontent.com/docsz/AD_4nXcfYSJgjHrovz6_62WlMOzMeH7xV0HcvO5tVteHLlQTdgxzlBJ0YaDPJUOoigABLZFxu8tjA3fnw_Ty0VsrtYJgjAeLsaQth1sjQRMe3D9ZS_hmwJvJyAswLDXiBMYobJG1FmXFYnaYN-OkkX-tBRcUMml2?key=b7Zt1bkaikaJJvXVjwxIyg');">
                <div class="skin-info">
                    <span>Épica</span>
                    <h3>Florescer espiritual</h3>
                </div>
              </div>
              <div class="skin-card" style="--bg-image: url('https://cdnb.artstation.com/p/assets/images/images/090/588/727/large/blake-byun-prestige-spirit-blossom-springs-aphelios-final-artstation-crop-2.jpg?1754323150');">
                <div class="skin-info">
                    <span>Prestigio</span>
                    <h3>Termas do Florescer espiritual prestigio</h3>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>A lua sussurra o caminho. Alune guia os passos.</p>
    </footer>

</body>
</html>
